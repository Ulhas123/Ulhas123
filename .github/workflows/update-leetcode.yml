name: Update LeetCode Stats Card

on:
  schedule:
    - cron: '0 0 * * *' # Runs daily at midnight UTC
  workflow_dispatch: # Allows manual trigger from GitHub Actions tab

permissions:
  contents: write

jobs:
  update-card:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Fetch and customize LeetCode stats card
        run: |
          curl -s "https://leetcard.jacoblin.cool/gzOutbjIj7?theme=dark&ext=heatmap" > leetcode_raw.svg
          sed 's|<text id="username-text">gzOutbjIj7</text>|<text id="username-text">Ulhas Karankar</text>|g' leetcode_raw.svg > leetcode.svg
          rm -f leetcode_raw.svg

      - name: Commit and push if updated
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add leetcode.svg
          if git diff --staged --quiet; then
            echo "No changes in LeetCode stats."
          else
            git commit -m "chore: auto-update LeetCode stats card"
            git push
          fi
